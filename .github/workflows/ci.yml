name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Manifest is valid JSON with required fields
        run: python -c "import json;d=json.load(open('.claude-plugin/plugin.json',encoding='utf-8'));assert d['name'] and d['version'] and d['license']=='MIT'"
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Personal paths, emails and key-like strings (files + history)
        run: |
          if git grep -nIE 'C:\\\\Users|C:/Users|[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[a-z]{2,}|(sk|ghp|AKIA)[-_A-Za-z0-9]{16,}' $(git rev-list --all) -- . ':!.github'; then echo "found"; exit 1; fi
      - name: Dependency licenses
        run: echo "stdlib only; no third-party dependencies"
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --offline README.md README.ar.md
